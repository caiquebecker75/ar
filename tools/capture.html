<!doctype html>
<meta charset="utf-8">
<title>Poster + og:image</title>
<!--
  Gera <pasta>/poster.webp (imagem enquanto o 3D carrega) e <pasta>/og.jpg
  (miniatura do link no WhatsApp) a partir dos textos e do(s) modelo(s) da página.
  http://localhost:8833/tools/capture.html?slug=<pasta-do-display>[&orbit=28deg%2078deg%20auto]

  Página com vários modelos (<script id="modelos">): não gera poster (cada modelo já tem o
  seu) e a og:image mostra todos lado a lado NA MESMA ESCALA, para a diferença de tamanho
  aparecer de verdade.
-->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lexend:wght@200;300;600&display=swap" rel="stylesheet">
<script type="module" src="/vendor/model-viewer.min.js"></script>
<style>
  body { margin: 0; font: 13px/1.5 ui-monospace, monospace; background: #ddd; }
  model-viewer { width: 720px; height: 900px; background: transparent; }
  pre { padding: 12px; }
</style>
<pre id="log">capturando…</pre>
<script type="module">
const P = new URLSearchParams(location.search);
const slug = P.get('slug');
const base = `${location.origin}/${slug}/`;
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
const save = async (path, blob) => (await fetch(`/__save?path=${encodeURIComponent(`${slug}/${path}`)}`, { method: 'POST', body: blob })).text();

try {
  // textos e modelos da própria página do display
  const page = new DOMParser().parseFromString(await (await fetch(`/${slug}/index.html`)).text(), 'text/html');
  const mvPage = page.querySelector('model-viewer');
  const eyebrow = page.querySelector('.eyebrow').textContent.trim();
  const t1 = page.querySelector('h1').childNodes[0].textContent.trim();
  const t2 = page.querySelector('h1 b').textContent.trim();
  const lista = page.querySelector('#modelos');
  const modelos = lista ? JSON.parse(lista.textContent) : [{ id: '', nome: '', src: 'display.glb' }];
  const varios = modelos.length > 1;

  await customElements.whenDefined('model-viewer');
  async function renderizar(src, camera) {
    const mv = document.createElement('model-viewer');
    for (const a of ['environment-image', 'exposure', 'shadow-intensity', 'shadow-softness']) mv.setAttribute(a, mvPage.getAttribute(a));
    mv.setAttribute('camera-orbit', P.get('orbit') || mvPage.getAttribute('camera-orbit'));
    for (const [k, v] of Object.entries(camera || {})) mv.setAttribute(k, v);
    mv.setAttribute('interaction-prompt', 'none');
    mv.setAttribute('loading', 'eager'); // carrega mesmo com a aba em segundo plano
    mv.src = new URL(src, base).href;
    document.body.prepend(mv);
    await new Promise((r) => mv.addEventListener('load', r, { once: true }));
    await new Promise((r) => setTimeout(r, 1500));
    return mv;
  }

  // câmera fixa quando há vários: mesma distância e mesmo alvo = mesma escala na imagem
  const camFixa = { 'camera-orbit': '28deg 78deg 3.2m', 'camera-target': '0m 0.68m 0m', 'field-of-view': '30deg' };
  const renders = [];
  for (const m of modelos) {
    const mv = await renderizar(m.src, varios ? camFixa : null);
    if (!varios) {
      const poster = await mv.toBlob({ mimeType: 'image/webp', qualityArgument: 0.85, idealAspect: false });
      log('poster.webp: ' + await save('poster.webp', poster));
    }
    renders.push({ m, img: await createImageBitmap(await mv.toBlob({ mimeType: 'image/png', idealAspect: false })) });
    mv.remove();
  }

  // ---------- og:image 1200x630 ----------
  await Promise.all(['30px Anton', '200 88px Lexend', '600 88px Lexend', '300 26px Lexend'].map((f) => document.fonts.load(f)));
  const c = Object.assign(document.createElement('canvas'), { width: 1200, height: 630 });
  const x = c.getContext('2d');
  x.fillStyle = '#F3F4EE'; x.fillRect(0, 0, 1200, 630);
  const glow = x.createRadialGradient(900, 360, 20, 900, 360, 330);
  glow.addColorStop(0, 'rgba(255,255,255,1)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = glow; x.fillRect(560, 0, 640, 630);

  if (!varios) {
    const { img } = renders[0];
    const h = 600, w = (img.width / img.height) * h;
    x.drawImage(img, 900 - w / 2, 630 - h + 6, w, h);
  } else {
    // todos na mesma escala, lado a lado, com o rótulo de cada tamanho em cima
    const h = 600, centros = renders.length === 2 ? [760, 1065] : renders.map((_, i) => 640 + (i + 0.5) * (540 / renders.length));
    renders.forEach(({ m, img }, i) => {
      const w = (img.width / img.height) * h;
      x.drawImage(img, centros[i] - w / 2, 22, w, h);
      x.font = '20px Anton'; x.letterSpacing = '1.5px';
      const lw = x.measureText(m.nome).width + 30;
      x.fillStyle = '#0E1110'; x.beginPath(); x.roundRect(centros[i] - lw / 2, 38, lw, 34, 17); x.fill();
      x.fillStyle = '#C0EE4E'; x.textAlign = 'center'; x.fillText(m.nome, centros[i], 63); x.textAlign = 'left';
    });
  }

  x.textBaseline = 'alphabetic';
  x.font = '30px Anton'; x.letterSpacing = '1.5px';
  x.fillStyle = '#0E1110'; x.fillText('75', 72, 92);
  x.fillStyle = '#A6D934'; x.fillText('LAB', 72 + x.measureText('75').width + 2, 92);

  x.fillStyle = '#A6D934'; x.fillRect(72, 184, 30, 3);
  x.font = '22px Anton'; x.letterSpacing = '4px'; x.fillStyle = '#0E1110';
  x.fillText(eyebrow.toUpperCase(), 116, 194);

  x.letterSpacing = '-1px';
  x.font = '200 88px Lexend'; x.fillText(t1.toUpperCase(), 66, 290);
  x.font = '600 88px Lexend'; x.fillText(t2.toUpperCase(), 66, 376);

  x.font = '300 26px Lexend'; x.letterSpacing = '0px'; x.fillStyle = '#54594E';
  if (varios) {
    const nomes = modelos.map((m) => m.nome);
    x.fillText(`Tamanhos ${nomes.slice(0, -1).join(', ')} e ${nomes.at(-1)}, em realidade`, 72, 440);
    x.fillText('aumentada e em tamanho real.', 72, 476);
  } else {
    x.fillText('Veja em realidade aumentada,', 72, 440);
    x.fillText('em tamanho real, no seu espaço.', 72, 476);
  }

  x.font = '21px Anton'; x.letterSpacing = '2.5px';
  const label = varios ? 'ESCOLHA E VEJA EM AR' : 'TOQUE PARA VER EM AR', lw = x.measureText(label).width + 56;
  x.fillStyle = '#C0EE4E'; x.beginPath(); x.roundRect(72, 520, lw, 58, 29); x.fill();
  x.fillStyle = '#0E1110'; x.fillText(label, 100, 557);

  const og = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.86));
  log('og.jpg: ' + await save('og.jpg', og));
  document.body.append(c);
  log('PRONTO');
} catch (e) {
  log('ERRO: ' + (e.stack || e));
}
</script>
