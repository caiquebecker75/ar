<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Modo imersivo · Stand NGV | AR 75 LAB</title>
<meta name="description" content="Entre no stand da NGV Ecossistema na Conexão Farma 2027 em 3D, sem a sala em volta.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F4EE">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23C0EE4E'/%3E%3Cg stroke='%230E1110' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M12 5v14M5.9 8.5l12.2 7M18.1 8.5l-12.2 7'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>if(location.protocol==='http:'&&!/^(localhost|127\.)/.test(location.hostname))location.replace('https://'+location.host+location.pathname+location.search+location.hash)</script>
<style>
  :root {
    --lime: #C0EE4E; --lime-d: #A6D934; --ink: #0E1110; --ink2: #54594E; --ink3: #9AA08F;
    --rule: #E3E7DA; --paper: #F3F4EE;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #DCDDD8; }
  body {
    font-family: 'Lexend', system-ui, -apple-system, sans-serif; color: var(--ink);
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  [hidden] { display: none !important; }
  button, a { font: inherit; color: inherit; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- HUD ---------- */
  .topo {
    position: fixed; top: calc(12px + var(--safe-t)); left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; pointer-events: none;
  }
  .chip {
    font-family: 'Anton', 'Impact', sans-serif; font-size: 12px; letter-spacing: 1.8px; text-transform: uppercase;
    background: var(--ink); color: var(--lime); padding: 9px 13px 8px; border-radius: 20px; text-decoration: none;
  }
  .chip.sair { pointer-events: auto; background: #fff; color: var(--ink); box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .dica {
    position: fixed; left: 50%; top: calc(62px + var(--safe-t)); transform: translateX(-50%);
    background: rgba(14,17,16,.82); color: #fff; font-size: 13px; font-weight: 300; line-height: 1.4; text-align: center;
    padding: 10px 14px; border-radius: 12px; width: max-content; max-width: calc(100vw - 32px);
    transition: opacity .8s; pointer-events: none;
  }
  .dica b { color: var(--lime); font-weight: 500; }
  .dica.some { opacity: 0; }
  .joy {
    position: fixed; left: 22px; bottom: calc(26px + var(--safe-b)); width: 128px; height: 128px; border-radius: 50%;
    background: rgba(14,17,16,.22); border: 2px solid rgba(255,255,255,.7); touch-action: none;
  }
  .joy i {
    position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    background: var(--lime); box-shadow: 0 4px 14px rgba(0,0,0,.25); pointer-events: none;
  }
  .joy span {
    position: absolute; left: 0; right: 0; top: -22px; text-align: center; font-size: 11px; font-weight: 400;
    color: var(--ink); pointer-events: none;
  }
  .acoes { position: fixed; right: 18px; bottom: calc(40px + var(--safe-b)); display: grid; gap: 10px; justify-items: end; }
  .acao {
    border: 0; cursor: pointer; background: var(--ink); color: var(--lime);
    font-family: 'Anton', 'Impact', sans-serif; font-size: 13px; letter-spacing: 1.4px; text-transform: uppercase;
    padding: 12px 16px 11px; border-radius: 14px;
  }
  @media (hover: hover) and (pointer: fine) { .joy { display: none; } }

  /* ---------- tela de entrada ---------- */
  .entrada {
    position: fixed; inset: 0; z-index: 5; background: var(--paper);
    display: grid; place-items: center; padding: calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b));
  }
  .entrada .box { width: min(460px, 100%); }
  .brand { font-family: 'Anton', 'Impact', sans-serif; font-size: 16px; letter-spacing: 1.4px; }
  .brand em { font-style: normal; color: var(--lime-d); }
  .eyebrow {
    font-family: 'Anton', 'Impact', sans-serif; font-size: 12px; letter-spacing: 2.6px; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px; margin-top: 34px;
  }
  .eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--lime-d); }
  h1 { font-weight: 200; text-transform: uppercase; letter-spacing: -.5px; font-size: clamp(40px, 12vw, 68px); line-height: .92; margin-top: 10px; }
  h1 b { font-weight: 600; display: block; }
  .entrada p { font-size: 15px; font-weight: 300; line-height: 1.55; color: var(--ink2); margin-top: 18px; }
  .entrada p b { font-weight: 500; color: var(--ink); }
  .barra { height: 3px; border-radius: 3px; background: var(--rule); overflow: hidden; margin-top: 26px; }
  .barra i { display: block; height: 100%; width: 0; background: var(--lime-d); transition: width .25s; }
  .cta {
    width: 100%; margin-top: 14px; border: 0; cursor: pointer;
    background: var(--lime); color: var(--ink); border-radius: 16px; padding: 18px 20px;
    font-family: 'Anton', 'Impact', sans-serif; font-size: 19px; letter-spacing: 1.6px; text-transform: uppercase;
    box-shadow: 0 12px 28px -14px rgba(110, 150, 20, .9);
  }
  .cta[disabled] { background: var(--rule); color: var(--ink3); box-shadow: none; cursor: progress; }
  .voltar { display: block; text-align: center; margin-top: 14px; font-size: 13px; font-weight: 300; color: var(--ink2); }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/three.module.min.js",
  "three/addons/": "../vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div class="topo">
  <span class="chip">Stand NGV · imersivo</span>
  <a class="chip sair" href="./">Sair</a>
</div>
<div class="dica some" role="status"></div>
<div class="joy" hidden><span>Andar</span><i></i></div>
<div class="acoes"><button class="acao" id="centralizar" type="button" hidden>Olhar para o stand</button></div>

<section class="entrada">
  <div class="box">
    <div class="brand">75<em>LAB</em></div>
    <div class="eyebrow">Conexão Farma 2027 · Abradilan</div>
    <h1>Modo <b>imersivo</b></h1>
    <p id="explica">Só o stand, sem a sala em volta. <b>Mova o celular</b> para olhar ao redor e use o <b>controle na tela</b> para andar.</p>
    <div class="barra"><i></i></div>
    <button class="cta" id="entrar" type="button" disabled>Carregando</button>
    <a class="voltar" href="./">Voltar para o AR</a>
  </div>
</section>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

const $ = (s) => document.querySelector(s);
const MODELO = 'display.glb?v=3', TAMANHO = 32572612; // mesmo arquivo da página de AR (já fica em cache)
const OLHO = 1.6, VELOCIDADE = 1.3, RAIO = 14, FOLGA = 0.35;
const toque = matchMedia('(pointer: coarse)').matches;
if (!toque) $('#explica').innerHTML = 'Só o stand, sem a sala em volta. <b>Arraste com o mouse</b> para olhar ao redor e use <b>W A S D</b> ou as setas para andar.';

// ---------- cena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NoToneMapping; // luz já assada nas texturas (render do Cycles)
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
// reflexos: o mesmo HDR de ambiente do projeto no Blender (a luz difusa já vem assada nas texturas)
new HDRLoader().load('../assets/hdr/dancing-hall.hdr', (hdr) => {
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = hdr;
});

const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 200);
camera.position.set(0, OLHO, 7.5);

function ajustarTela() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  // abertura horizontal parecida no celular em pé e deitado
  camera.fov = THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(29)) / camera.aspect)), 60, 90);
  camera.updateProjectionMatrix();
}
ajustarTela();
addEventListener('resize', ajustarTela);

// estúdio neutro em volta: céu em gradiente e piso claro que some no horizonte
function textura(w, h, pintar) {
  const c = Object.assign(document.createElement('canvas'), { width: w, height: h });
  pintar(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const ceu = textura(4, 256, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#F1F1EC'); g.addColorStop(0.5, '#DCDDD8'); g.addColorStop(1, '#DCDDD8');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(80, 48, 24), new THREE.MeshBasicMaterial({ map: ceu, side: THREE.BackSide, depthWrite: false })));
const piso = textura(512, 512, (x, w, h) => {
  const g = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  g.addColorStop(0, '#B4B5B0'); g.addColorStop(0.3, '#BFC0BB'); g.addColorStop(1, '#DCDDD8');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
});
const chao = new THREE.Mesh(new THREE.CircleGeometry(80, 96), new THREE.MeshBasicMaterial({ map: piso }));
chao.rotation.x = -Math.PI / 2;
chao.position.y = -0.01;
scene.add(chao);

// ---------- stand ----------
const obstaculos = [];
new GLTFLoader().load(MODELO, (gltf) => {
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    obstaculos.push(o);
        const m = o.material;
    // textura assada vem como emissiva (base preta): mostra o render; a rugosidade dá o reflexo do HDR
    if (m.emissiveMap) m.envMapIntensity = 1;
  });
  scene.add(gltf.scene);
  gltf.scene.updateMatrixWorld(true);
  renderer.compile(scene, camera);
  $('.barra i').style.width = '100%';
  const b = $('#entrar');
  b.disabled = false;
  b.textContent = 'Entrar no stand';
}, (e) => {
  const p = Math.min(0.99, e.loaded / (e.total || TAMANHO));
  $('.barra i').style.width = `${Math.round(p * 100)}%`;
  $('#entrar').textContent = `Carregando ${Math.round(p * 100)}%`;
}, () => {
  $('#entrar').textContent = 'Não carregou. Recarregue a página';
});

// ---------- olhar: giroscópio do celular ou arrastar ----------
let yaw = 0, pitch = -0.05;   // sem giroscópio
let correcao = 0;              // com giroscópio: gira o "norte" para o stand ficar à frente
let giro = null;
const eixoY = new THREE.Vector3(0, 1, 0), eixoZ = new THREE.Vector3(0, 0, 1);
const qTela = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // câmera olha para o fundo do aparelho
const euler = new THREE.Euler(), qCel = new THREE.Quaternion(), qAux = new THREE.Quaternion();
const rad = THREE.MathUtils.degToRad;

function quaternionDoCelular() {
  const angulo = screen.orientation ? screen.orientation.angle : (window.orientation || 0);
  euler.set(rad(giro.beta), rad(giro.alpha), -rad(giro.gamma), 'YXZ');
  return qCel.setFromEuler(euler).multiply(qTela).multiply(qAux.setFromAxisAngle(eixoZ, -rad(angulo)));
}
// rumo no plano do chão (0 = olhando para -Z, que é onde está o stand no começo)
const rumo = (q) => {
  const f = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  return Math.atan2(-f.x, -f.z);
};
function olharParaOStand() {
  const alvo = Math.atan2(camera.position.x, camera.position.z);
  if (giro) correcao = alvo - rumo(quaternionDoCelular());
  else { yaw = alvo; pitch = -0.05; }
}
function aplicarOlhar() {
  if (giro) camera.quaternion.setFromAxisAngle(eixoY, correcao).multiply(quaternionDoCelular());
  else camera.quaternion.setFromEuler(euler.set(pitch, yaw, 0, 'YXZ'));
}
function ouvirGiroscopio() {
  addEventListener('deviceorientation', (e) => {
    if (e.alpha == null) return;
    const primeiro = !giro;
    giro = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
    if (primeiro) { olharParaOStand(); $('#centralizar').hidden = false; }
  });
}

let arrasto = null;
canvas.addEventListener('pointerdown', (e) => {
  arrasto = { id: e.pointerId, x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!arrasto || e.pointerId !== arrasto.id) return;
  const k = toque ? 0.005 : 0.004, dx = e.clientX - arrasto.x, dy = e.clientY - arrasto.y;
  arrasto.x = e.clientX; arrasto.y = e.clientY;
  if (giro) correcao += dx * k;
  else { yaw += dx * k; pitch = THREE.MathUtils.clamp(pitch + dy * k, -1.3, 1.3); }
});
const soltarArrasto = (e) => { if (arrasto && e.pointerId === arrasto.id) arrasto = null; };
canvas.addEventListener('pointerup', soltarArrasto);
canvas.addEventListener('pointercancel', soltarArrasto);
$('#centralizar').addEventListener('click', olharParaOStand);

// ---------- andar: controle na tela ou teclado ----------
const joy = $('.joy'), bolinha = joy.querySelector('i');
let controle = { x: 0, y: 0 }, dedo = null;
function moverControle(e) {
  const r = joy.getBoundingClientRect(), max = r.width / 2 - 12;
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const l = Math.hypot(dx, dy);
  if (l > max) { dx *= max / l; dy *= max / l; }
  bolinha.style.transform = `translate(${dx}px, ${dy}px)`;
  controle = { x: dx / max, y: dy / max };
}
joy.addEventListener('pointerdown', (e) => { dedo = e.pointerId; joy.setPointerCapture(e.pointerId); moverControle(e); });
joy.addEventListener('pointermove', (e) => { if (e.pointerId === dedo) moverControle(e); });
const soltarControle = (e) => {
  if (e.pointerId !== dedo) return;
  dedo = null; controle = { x: 0, y: 0 }; bolinha.style.transform = '';
};
joy.addEventListener('pointerup', soltarControle);
joy.addEventListener('pointercancel', soltarControle);

const teclas = new Set();
addEventListener('keydown', (e) => teclas.add(e.key.toLowerCase()));
addEventListener('keyup', (e) => teclas.delete(e.key.toLowerCase()));
addEventListener('blur', () => teclas.clear());

// colisão: raios curtos na altura da canela, da cintura e do peito; testa X e Z separados para deslizar na parede
const raio = new THREE.Raycaster(), origem = new THREE.Vector3(), direcao = new THREE.Vector3();
function livre(dx, dz) {
  direcao.set(Math.sign(dx), 0, Math.sign(dz));
  raio.far = FOLGA;
  for (const h of [0.3, 1.0, 1.5]) {
    raio.set(origem.set(camera.position.x, h, camera.position.z), direcao);
    if (raio.intersectObjects(obstaculos, false).length) return false;
  }
  return true;
}
function andar(dx, dz) {
  if (dx && livre(dx, 0)) camera.position.x += dx;
  if (dz && livre(0, dz)) camera.position.z += dz;
  const r = Math.hypot(camera.position.x, camera.position.z);
  if (r > RAIO) { camera.position.x *= RAIO / r; camera.position.z *= RAIO / r; }
}

// ---------- entrar ----------
function dica(html, ms = 5500) {
  const d = $('.dica');
  d.innerHTML = html;
  d.classList.remove('some');
  clearTimeout(dica.t);
  dica.t = setTimeout(() => d.classList.add('some'), ms);
}
$('#entrar').addEventListener('click', async () => {
  if (toque && window.DeviceOrientationEvent) {
    // iPhone: o acesso ao giroscópio precisa ser pedido num toque
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try { await DeviceOrientationEvent.requestPermission(); } catch { /* segue no modo arrastar */ }
    }
    ouvirGiroscopio();
  }
  $('.entrada').hidden = true;
  if (toque) {
    joy.hidden = false;
    dica('<b>Mova o celular</b> para olhar em volta · <b>controle</b> embaixo para andar');
    setTimeout(() => { if (!giro) dica('Arraste na tela para olhar em volta · <b>controle</b> embaixo para andar'); }, 1500);
  } else {
    dica('<b>Arraste</b> para olhar em volta · <b>W A S D</b> ou setas para andar');
  }
});

// ---------- loop ----------
const relogio = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(relogio.getDelta(), 0.05);
  aplicarOlhar();
  let lado = controle.x, frente = -controle.y;
  if (teclas.size) {
    const t = (...k) => (k.some((x) => teclas.has(x)) ? 1 : 0);
    lado = t('d', 'arrowright') - t('a', 'arrowleft');
    frente = t('w', 'arrowup') - t('s', 'arrowdown');
  }
  if (lado || frente) {
    const r = rumo(camera.quaternion), f = frente * VELOCIDADE * dt, s = lado * VELOCIDADE * dt;
    // frente = (-sen, -cos), direita = (cos, -sen)
    andar(-Math.sin(r) * f + Math.cos(r) * s, -Math.cos(r) * f - Math.sin(r) * s);
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
